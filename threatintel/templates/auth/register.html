{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="card shadow-sm mx-auto auth-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Create an account</h1>
      <form method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input name="username" id="username" class="form-control" maxlength="64" autocomplete="username" required>
          <div class="form-text">Up to 64 characters.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" name="password" id="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
          <div class="form-text">8 to 128 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>
      <p class="small text-body-secondary mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
  </div>
{% endblock %}
