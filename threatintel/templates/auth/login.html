{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
  <div class="card shadow-sm mx-auto auth-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Log in</h1>
      <form method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input name="username" id="username" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="small text-body-secondary mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
  </div>
{% endblock %}
